<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku AI — Minimax</title>
    <meta name="description" content="Chơi cờ Gomoku với AI sử dụng thuật toán Minimax Alpha-Beta Pruning. Chọn mức độ khó và thách thức trí tuệ nhân tạo.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <!-- ===== Header ===== -->
    <header class="header">
        <h1 class="title">♟ Gomoku AI</h1>
        <p class="subtitle">Minimax Algorithm · Alpha-Beta Pruning</p>
    </header>

    <!-- ===== Controls ===== -->
    <div class="controls" id="controls">
        <div class="control-group">
            <span class="control-label">Độ khó</span>
            <div class="difficulty-selector">
                <button class="diff-btn" data-level="easy">Dễ</button>
                <button class="diff-btn active" data-level="medium">Trung bình</button>
                <button class="diff-btn" data-level="hard">Khó</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Bắt đầu</span>
            <div class="action-buttons">
                <button class="btn btn-primary" id="btnFirst" onclick="startGame('human')">Đi trước</button>
                <button class="btn btn-secondary" id="btnSecond" onclick="startGame('ai')">Đi sau</button>
            </div>
        </div>
    </div>

    <!-- ===== Game Area ===== -->
    <div class="game-area">
        <div class="board-wrapper" id="boardWrapper">
            <div class="board" id="board"></div>
        </div>

        <div class="side-controls">
            <button class="btn-icon" id="btnUndo" onclick="undoMove()" title="Đi lại (Undo)">↩</button>
            <button class="btn-icon" id="btnReset" onclick="resetGame()" title="Reset">⟳</button>
        </div>
    </div>

    <!-- ===== Legend ===== -->
    <div class="legend">
        <div class="legend-item">
            <span class="legend-symbol o-mark">O</span>
            <span>Bạn</span>
        </div>
        <div class="legend-item">
            <span class="legend-symbol x-mark">✕</span>
            <span>AI</span>
        </div>
    </div>

    <!-- ===== Status ===== -->
    <div class="status-bar">
        <span id="status">Chọn mức độ khó và nhấn bắt đầu</span>
    </div>

</div>

<!-- ===== Result Modal ===== -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-card">
        <div class="modal-emoji" id="resultEmoji">🏆</div>
        <h2 class="modal-title" id="resultTitle">Kết quả</h2>
        <p class="modal-text" id="resultText"></p>
        <button class="btn btn-primary" onclick="hideResult()">Chơi tiếp</button>
    </div>
</div>

<!-- Game Logic -->
<script src="{{ url_for('static', filename='js/game.js') }}"></script>

</body>
</html>
